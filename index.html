<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Seserahan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        rose: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            500: '#f43f5e',
                            600: '#e11d48',
                            900: '#881337',
                        },
                        shopee: '#ee4d2d'
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #fff1f2;
        }
        ::-webkit-scrollbar-thumb {
            background: #f43f5e;
            border-radius: 10px;
        }
        .item-enter {
            animation: slideIn 0.3s ease-out forwards;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-rose-50 min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-10 rounded-b-3xl">
        <div class="max-w-2xl mx-auto px-6 py-5 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold text-rose-900 tracking-tight">Seserahan<span class="text-rose-500">Ku</span></h1>
                <p class="text-xs text-gray-500 mt-1">Siapkan hari bahagiamu dengan rapi 💍</p>
            </div>
            <div class="h-10 w-10 bg-rose-100 rounded-full flex items-center justify-center text-rose-500">
                <i class="fa-solid fa-heart"></i>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 sm:px-6 mt-6 space-y-6">
        
        <!-- Summary Dashboard -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-rose-100">
                <p class="text-xs text-gray-500 mb-1">Total Estimasi</p>
                <p class="text-lg font-bold text-gray-800" id="totalBudget">Rp 0</p>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-rose-100">
                <p class="text-xs text-gray-500 mb-1">Sudah Dibeli</p>
                <div class="flex items-baseline gap-1">
                    <p class="text-lg font-bold text-rose-600" id="totalBought">0</p>
                    <p class="text-sm text-gray-500">/ <span id="totalItems">0</span> item</p>
                </div>
            </div>
        </div>

        <!-- Add Item Form -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-rose-100">
            <h2 class="text-sm font-semibold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-plus-circle text-rose-500"></i> Tambah Barang
            </h2>
            <form id="addItemForm" class="space-y-4">
                <div>
                    <input type="text" id="itemName" required placeholder="Nama Barang (Cth: Mukena Silk)" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-rose-200 focus:border-rose-500 transition-colors text-sm">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="relative">
                        <span class="absolute left-4 top-2.5 text-gray-500 text-sm">Rp</span>
                        <input type="number" id="itemPrice" required min="0" placeholder="Harga" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-rose-200 focus:border-rose-500 transition-colors text-sm">
                    </div>
                    <div>
                        <select id="itemCategory" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-rose-200 focus:border-rose-500 transition-colors text-sm text-gray-600 bg-white">
                            <option value="Ibadah">Alat Ibadah</option>
                            <option value="Skincare">Skincare & Makeup</option>
                            <option value="Toileters">Toileters (Sabun, dll)</option>
                            <option value="Pakaian">Pakaian</option>
                            <option value="Pakaian Dalam">Pakaian Dalam</option>
                            <option value="Tas Sepatu">Tas & Sepatu</option>
                            <option value="Aksesoris">Aksesoris</option>
                            <option value="Bedcover">Bedcover</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                </div>
                <div>
                    <input type="url" id="itemLink" placeholder="Link Shopee (Opsional)" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-rose-200 focus:border-rose-500 transition-colors text-sm">
                </div>
                <button type="submit" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-medium py-3 rounded-xl transition-colors shadow-sm shadow-rose-200">
                    Simpan ke Daftar
                </button>
            </form>
        </div>

        <!-- Filter & List Header -->
        <div class="flex items-center justify-between pt-2">
            <h2 class="text-lg font-bold text-gray-800">Daftar Belanjaan</h2>
        </div>

        <!-- Items List container -->
        <div id="itemsContainer" class="space-y-3">
            <!-- Items will be injected here by JS -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-10">
            <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto mb-3 shadow-sm text-gray-300">
                <i class="fa-solid fa-box-open text-3xl"></i>
            </div>
            <p class="text-gray-500 text-sm">Belum ada barang yang ditambahkan.</p>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, updateDoc, deleteDoc, onSnapshot, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Konfigurasi Database dan Auth
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'catatan-seserahan-app';
        let firebaseConfig = {};
        try {
            firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        } catch (e) {
            console.error("Firebase config error:", e);
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State Management 
        let userId = null;
        let seserahanItems = [];

        // DOM Elements
        const form = document.getElementById('addItemForm');
        const itemsContainer = document.getElementById('itemsContainer');
        const emptyState = document.getElementById('emptyState');
        const totalBudgetEl = document.getElementById('totalBudget');
        const totalBoughtEl = document.getElementById('totalBought');
        const totalItemsEl = document.getElementById('totalItems');

        // Helper: Format to IDR
        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        };

        // Render UI
        const renderApp = () => {
            // Update Dashboard
            const totalBudget = seserahanItems.reduce((sum, item) => sum + Number(item.price), 0);
            const totalBought = seserahanItems.filter(item => item.isBought).length;
            
            totalBudgetEl.textContent = formatRupiah(totalBudget);
            totalBoughtEl.textContent = totalBought;
            totalItemsEl.textContent = seserahanItems.length;

            // Render List
            itemsContainer.innerHTML = '';
            
            if (seserahanItems.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                // Urutkan: Yang belum dibeli di atas, lalu urutkan berdasarkan waktu ditambahkan (terbaru di atas)
                const sortedItems = [...seserahanItems].sort((a, b) => {
                    if (a.isBought !== b.isBought) {
                        return a.isBought - b.isBought;
                    }
                    return (b.createdAt || 0) - (a.createdAt || 0);
                });

                sortedItems.forEach(item => {
                    const itemEl = document.createElement('div');
                    itemEl.className = `item-enter bg-white p-4 rounded-2xl shadow-sm border ${item.isBought ? 'border-green-100 bg-green-50/30' : 'border-rose-100'} flex items-center gap-4 transition-all duration-300`;
                    
                    const shoppeButton = item.link ? `
                        <a href="${item.link}" target="_blank" class="w-8 h-8 rounded-full bg-shopee/10 text-shopee flex items-center justify-center hover:bg-shopee/20 transition-colors" title="Buka di Shopee">
                            <i class="fa-solid fa-bag-shopping text-sm"></i>
                        </a>
                    ` : '';

                    itemEl.innerHTML = `
                        <!-- Checkbox -->
                        <button onclick="toggleBought('${item.id}')" class="w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition-colors ${item.isBought ? 'bg-green-500 border-green-500 text-white' : 'border-gray-300 text-transparent hover:border-rose-400'}">
                            <i class="fa-solid fa-check text-xs"></i>
                        </button>
                        
                        <!-- Details -->
                        <div class="flex-1 min-w-0">
                            <h3 class="text-sm font-semibold ${item.isBought ? 'text-gray-400 line-through' : 'text-gray-800'} truncate">${item.name}</h3>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="text-[10px] px-2 py-0.5 rounded-full bg-gray-100 text-gray-600 font-medium">${item.category}</span>
                                <span class="text-xs text-rose-600 font-medium">${formatRupiah(item.price)}</span>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="flex items-center gap-2 flex-shrink-0">
                            ${shoppeButton}
                            <button onclick="deleteItem('${item.id}')" class="w-8 h-8 rounded-full bg-gray-50 text-gray-400 flex items-center justify-center hover:bg-red-50 hover:text-red-500 transition-colors">
                                <i class="fa-regular fa-trash-can text-sm"></i>
                            </button>
                        </div>
                    `;
                    itemsContainer.appendChild(itemEl);
                });
            }
        };

        // Form Submit Handler
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!userId) return; // Pastikan user sudah teregistrasi di sistem
            
            const submitBtn = form.querySelector('button[type="submit"]');
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';
            submitBtn.disabled = true;
            
            const name = document.getElementById('itemName').value;
            const price = document.getElementById('itemPrice').value;
            const category = document.getElementById('itemCategory').value;
            const link = document.getElementById('itemLink').value;

            const newItem = {
                name,
                price: Number(price),
                category,
                link,
                isBought: false,
                createdAt: Date.now()
            };

            try {
                const itemsRef = collection(db, 'artifacts', appId, 'users', userId, 'items');
                await addDoc(itemsRef, newItem);
                form.reset();
            } catch (error) {
                console.error("Error saving data:", error);
            } finally {
                submitBtn.innerHTML = 'Simpan ke Daftar';
                submitBtn.disabled = false;
            }
        });

        // Toggle Status via Database
        window.toggleBought = async (id) => {
            if (!userId) return;
            const item = seserahanItems.find(i => i.id === id);
            if (!item) return;
            
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'items', id);
                await updateDoc(docRef, { isBought: !item.isBought });
            } catch (error) {
                console.error("Error updating status:", error);
            }
        };

        // Delete Item via Database
        window.deleteItem = async (id) => {
            if (!userId) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'items', id);
                await deleteDoc(docRef);
            } catch (error) {
                console.error("Error deleting item:", error);
            }
        };

        // Inisialisasi Aplikasi (Login Otomatis dan Ambil Data)
        const initApp = async () => {
            itemsContainer.innerHTML = '<div class="text-center py-6 text-gray-400"><i class="fa-solid fa-spinner fa-spin text-2xl"></i><p class="text-sm mt-2">Memuat data...</p></div>';
            
            try {
                // Login Sistem
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                if (!auth.currentUser) return;
                userId = auth.currentUser.uid;
                
                // Mendengarkan perubahan data secara Real-time
                const itemsRef = collection(db, 'artifacts', appId, 'users', userId, 'items');
                
                onSnapshot(itemsRef, (snapshot) => {
                    seserahanItems = [];
                    snapshot.forEach(doc => {
                        seserahanItems.push({ id: doc.id, ...doc.data() });
                    });
                    renderApp();
                }, (error) => {
                    console.error("Error fetching real-time data:", error);
                    itemsContainer.innerHTML = '<p class="text-center text-red-400 py-4 text-sm">Gagal memuat data.</p>';
                });
                
            } catch (error) {
                console.error("Authentication Error:", error);
                itemsContainer.innerHTML = '<p class="text-center text-red-400 py-4 text-sm">Gagal menghubungkan ke database.</p>';
            }
        };

        // Jalankan aplikasi
        initApp();
    </script>
</body>
</html>
